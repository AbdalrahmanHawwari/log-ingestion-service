version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: log_db
    environment:
      POSTGRES_USER: Abdalrahman
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: log_service_db
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1000M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Abdalrahman -d log_service_db"]
      interval: 3s
      timeout: 3s
      retries: 5
      stop_grace_period: 2s

  app:
    build: .
    container_name: log_app
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://Abdalrahman:postgres@db:5432/log_service_db
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      stop_grace_period: 2s
