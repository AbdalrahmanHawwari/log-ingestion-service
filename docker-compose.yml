version: "3.8"

services:
  log_db:
    image: postgres:16-alpine
    container_name: log_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: log_service_db
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=30
      -c synchronous_commit=off
      -c fsync=off
      -c full_page_writes=off
      -c random_page_cost=1.1
      -c max_parallel_workers_per_gather=1
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_service_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1000M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://postgres:postgres@log_db:5432/log_service_db"
      AUTH_ENABLED: "false"
    depends_on:
      log_db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  pgdata:
